<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RuralLearn — Learn Anywhere, Grow Everywhere</title>
    <script>
      // GitHub Pages SPA hack (https://github.com/rafgraph/spa-github-pages)
      // Takes a deep link like /Virtual-Classroom/teacher/login and redirects to
      // /Virtual-Classroom/?/teacher/login so index.html can restore the route.
      // segmentCount = 1 because this is a Project site under /<repo>/.
      (function () {
        var segmentCount = 1;
        var l = window.location;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + segmentCount)
              .join('/') +
            '/?/' +
            l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
